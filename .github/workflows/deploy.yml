name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      source_ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"
        type: string

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref_name }}-${{ inputs.target_environment || 'development' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  NPM_CONFIG_OPTIONAL: "true"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/**/pnpm-lock.yaml
            packages/**/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build data-ops
        run: pnpm run build:data-ops

  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'development' }}
    runs-on: ubuntu-latest
    needs: [verify]
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'development' }}
    env:
      TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'development' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/**/pnpm-lock.yaml
            packages/**/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build data-ops
        run: pnpm run build:data-ops

      - name: Build user-application
        run: pnpm --filter user-application build

      - name: Deploy user-application
        run: pnpm --filter user-application exec wrangler deploy --name "tanstack-start-app-${TARGET_ENV}"

      - name: Deploy data-service
        run: pnpm --filter data-service exec wrangler deploy --name "saas-kit-data-service-${TARGET_ENV}"
